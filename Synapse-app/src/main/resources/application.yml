server:
  port: 4396

spring:
  application:
    name: SynapseAI
    
  # 数据源配置
  datasource:
    url: jdbc:postgresql://localhost:5432/synapseai
    username: postgres
    password: ZXCzxc254@
    driver-class-name: org.postgresql.Driver
    
  # Jackson 配置
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

# MyBatis Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:mapper/**/*.xml

# LLM 配置
llm:
  siliconflow:
    # 生产环境使用环境变量
    api-url: https://api.siliconflow.cn/v1/chat/completions
    api-key: sk-rpytzwolihqexvommapbpdrfnsdudivnrlqmvidksppgqmwm
    default-model: tencent/Hunyuan-MT-7B
    timeout: 60000
    
# 开发环境配置在 application-dev.yml 中
# 启动时添加参数：--spring.profiles.active=dev

# 日志配置
logging:
  level:
    root: info
    cn.chenyukun.synapse: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"

